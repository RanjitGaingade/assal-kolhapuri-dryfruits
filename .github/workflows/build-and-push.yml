name: Build and Push API to ECR

on:
  push:
    branches:
      - aws-terraform-infra

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: assal-kolhapuri-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::104367407330:role/assal-kolhapuri-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify Docker build context
        run: |
          echo "========================================"
          echo "GitHub SHA: $GITHUB_SHA"
          echo "GitHub REF: $GITHUB_REF"
          echo "Working directory: $(pwd)"
          echo "========================================"

          echo ""
          echo "Docker version:"
          docker --version

          echo ""
          echo "Dockerfile:"
          echo "========================================"
          cat Dockerfile
          echo "========================================"

          echo ""
          echo "Checking for Go-related files:"
          find . -name '.go-version' -o -name 'Dockerfile*' -print

          echo ""
          echo "Repository files:"
          find . -maxdepth 2 -type f \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            | sort

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/${ECR_REPOSITORY}:${GITHUB_SHA} \
            -t $ECR_REGISTRY/${ECR_REPOSITORY}:latest \
            .

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/${ECR_REPOSITORY}:${GITHUB_SHA}
          docker push $ECR_REGISTRY/${ECR_REPOSITORY}:latest
