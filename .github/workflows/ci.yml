name: Node.js CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]


# ============================================================
# GLOBAL VARIABLES
# ============================================================

env:
  IMAGE_NAME: ranjit1984/assal-kolhapuri-dryfruits-api


jobs:

  # ============================================================
  # 1. PREPARE
  # ============================================================

  prepare:
    name: Prepare Image Tag
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:

      - name: Generate Short Git SHA
        id: vars
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"

          echo "Git SHA: ${GITHUB_SHA}"
          echo "Docker Image Tag: ${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"


  # ============================================================
  # 2. TEST
  # ============================================================

  test:
    name: Lint, Test and Validate
    runs-on: ubuntu-latest

    needs: prepare

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      - name: Install Dependencies
        run: npm ci


      - name: ESLint
        run: npm run lint


      - name: Jest Tests
        run: npm test


      - name: Validate Prisma Schema
        run: npx prisma validate


      - name: Generate Prisma Client
        run: npx prisma generate


  # ============================================================
  # 3. BUILD + SECURITY SCAN
  # ============================================================

  security:
    name: Build and Security Scan
    runs-on: ubuntu-latest

    needs:
      - prepare
      - test

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.image_tag }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.image_tag }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH


  # ============================================================
  # 4. PUSH IMAGE TO DOCKER HUB
  # ============================================================

  docker:
    name: Push Docker Image
    runs-on: ubuntu-latest

    needs:
      - prepare
      - security

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          platforms: linux/amd64,linux/arm64

          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # 5. DEPLOY TO EC2
  # ============================================================

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs:
      - prepare
      - docker

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            # --------------------------------------------------
            # Application directory
            # --------------------------------------------------

            cd /home/ec2-user/assal-kolhapuri-dryfruits


            echo "========================================"
            echo "Starting deployment"
            echo "========================================"


            # --------------------------------------------------
            # Pull latest Compose configuration
            # --------------------------------------------------

            echo "Pulling latest repository..."

            git pull origin main


            # --------------------------------------------------
            # Set exact Git SHA image tag
            # --------------------------------------------------

            export IMAGE_TAG=${{ needs.prepare.outputs.image_tag }}

            echo "IMAGE_TAG=${IMAGE_TAG}"

            echo "Docker image:"
            echo "ranjit1984/assal-kolhapuri-dryfruits-api:${IMAGE_TAG}"


            # --------------------------------------------------
            # Verify Docker Compose configuration
            # --------------------------------------------------

            echo "Docker Compose configuration:"

            docker compose config | grep -A5 -B2 'image:'


            # --------------------------------------------------
            # Pull exact Docker image
            # --------------------------------------------------

            echo "Pulling API image..."

            docker compose pull api


            # --------------------------------------------------
            # Recreate API container
            # --------------------------------------------------

            echo "Recreating API container..."

            docker compose up -d --force-recreate api


            # --------------------------------------------------
            # Deployment status
            # --------------------------------------------------

            echo "Deployment status:"

            docker compose ps


            # --------------------------------------------------
            # Verify actual running image
            # --------------------------------------------------

            echo "Running API image:"

            docker inspect assal-api \
              --format '{{.Config.Image}}'


            echo "========================================"
            echo "Deployment completed"
            echo "========================================"
