name: Node.js CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:

  # ========================================
  # TEST
  # ========================================

  test:
    name: Lint, Test and Validate
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Jest Tests
        run: npm test

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate


  # ========================================
  # DOCKER BUILD + SECURITY SCAN
  # ========================================

  security:
    name: Build and Security Scan
    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ----------------------------------------
      # Docker Build
      # ----------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: assal-api:${{ github.sha }}


      # ----------------------------------------
      # Trivy Scan
      # ----------------------------------------

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: assal-api:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH


  # ========================================
  # PUSH IMAGE
  # ========================================

  docker:
    name: Push Docker Image
    runs-on: ubuntu-latest

    needs: security

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          platforms: linux/amd64,linux/arm64

          tags: |
            ranjit1984/assal-kolhapuri-dryfruits-api:${{ github.sha }}
            ranjit1984/assal-kolhapuri-dryfruits-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # DEPLOY
  # ========================================

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs: docker

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            cd /home/ec2-user/assal-kolhapuri-dryfruits

            echo "Pulling latest repository..."

            git pull origin main


            echo "Pulling latest API image..."

            docker compose pull api


            echo "Recreating API container..."

            docker compose up -d --force-recreate api


            echo "Deployment status..."

            docker compose ps