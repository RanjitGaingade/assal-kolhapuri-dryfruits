<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Checkout - Assal Kolhapuri Dryfruits</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

<header>

  <div class="logo">

    <img
      src="images/logo.jpg"
      alt="Assal Kolhapuri Dryfruits"
    >

    <span>
      ASSAL KOLHAPURI DRYFRUITS
    </span>

  </div>

  <nav>

    <a href="index.html">
      ← Continue Shopping
    </a>

  </nav>

</header>


<main class="checkout-page">

  <div class="checkout-container">

    <section class="checkout-form">

      <p class="eyebrow">
        CHECKOUT
      </p>

      <h1>
        Complete Your Order
      </h1>

      <form id="checkoutForm">

        <div class="form-group">

          <label for="customerName">
            Full Name
          </label>

          <input
            type="text"
            id="customerName"
            required
            placeholder="Enter your full name"
          >

        </div>


        <div class="form-group">

          <label for="mobile">
            Mobile Number
          </label>

          <input
            type="tel"
            id="mobile"
            required
            pattern="[0-9]{10}"
            maxlength="10"
            placeholder="10-digit mobile number"
          >

        </div>


        <div class="form-group">

          <label for="address">
            Delivery Address
          </label>

          <textarea
            id="address"
            required
            placeholder="House / Flat, Street, Area"
          ></textarea>

        </div>


        <div class="form-row">

          <div class="form-group">

            <label for="city">
              City
            </label>

            <input
              type="text"
              id="city"
              required
              placeholder="City"
            >

          </div>


          <div class="form-group">

            <label for="pincode">
              Pincode
            </label>

            <input
              type="text"
              id="pincode"
              required
              pattern="[0-9]{6}"
              maxlength="6"
              placeholder="6-digit pincode"
            >

          </div>

        </div>


        <button
          type="submit"
          class="place-order-button"
        >
          Place Order
        </button>

      </form>

    </section>


    <aside class="checkout-summary">

      <h2>
        Your Order
      </h2>

      <div id="checkoutItems">
        Loading...
      </div>


      <div class="checkout-total-row">

        <span>
          Subtotal
        </span>

        <strong id="checkoutSubtotal">
          ₹0
        </strong>

      </div>


      <div class="checkout-total-row">

        <span>
          Delivery
        </span>

        <strong id="checkoutDelivery">
          ₹0
        </strong>

      </div>


      <div class="checkout-grand-total">

        <span>
          Total
        </span>

        <strong id="checkoutTotal">
          ₹0
        </strong>

      </div>

    </aside>

  </div>

</main>


<script src="js/checkout.js"></script>

</body>

</html>
